[project]
name = "comfyui-model-librarian"
description = "Model manager for shared model folders (Stability Matrix or Comfy Desktop), built to work alongside LoRA Manager: missing-model downloads (with a CivArchive fallback for removed models), workflow sharing with download links, CivitAI library, base-model organizer, recipes from images and videos, image-folder archives with reproducible thumbnails, workflow health, update alerts with version comparison, HuggingFace details, dedupe, metadata sync, SSD/HDD storage tiers with a free-space goal and history, and a Gallery Info node that tags generations for Model Librarian Gallery."
version = "1.25.1"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/EY4O/ComfyUI-Model-Librarian"
"Bug Tracker" = "https://github.com/EY4O/ComfyUI-Model-Librarian/issues"
#  Used by Comfy Registry https://registry.comfy.org

[tool.comfy]
PublisherId = "looneth"
DisplayName = "Model Librarian"
Icon = "https://raw.githubusercontent.com/EY4O/ComfyUI-Model-Librarian/main/docs/images/icon.png"
